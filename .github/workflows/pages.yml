name: Publicar página de apresentação
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gerar configuração do recebimento privado
        env:
          LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT }}
        run: |
          python3 - <<'PYCONFIG'
          import json, os
          from pathlib import Path
          from urllib.parse import urlparse
          endpoint = os.environ.get('LEAD_ENDPOINT', '')
          parsed = urlparse(endpoint)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.username or parsed.password:
              raise SystemExit('Configure LEAD_ENDPOINT após validar armazenamento e privacidade. Coleta não habilitada.')
          Path('site/config.js').write_text('window.AED_CONFIG = Object.freeze(' + json.dumps({'leadEndpoint': endpoint, 'collectionEnabled': True}) + ');\n', encoding='utf-8')
          PYCONFIG
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
